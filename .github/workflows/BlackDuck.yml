name: BlackDuck Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blackduck-scan:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Black Duck SCA Scan
        uses: blackduck-inc/black-duck-security-scan@3fe94e4b3c3947bd21ba46b7da255d6d3638b325 # v2.11.0
        env:
          DETECT_PROJECT_NAME: ${{ github.event.repository.name }}
          DETECT_PROJECT_GROUP_NAME: JustMock
          DETECT_PROJECT_VERSION_NAME: ${{ github.ref_name }}
        with:
          bridgecli_download_version: '3.7.1'
          blackducksca_url: 'https://progresssoftware.app.blackduck.com'
          blackducksca_token: ${{ secrets.BLACKDUCK_API_TOKEN }}
          blackducksca_scan_full: true
          project_directory: .
          blackducksca_scan_failure_severities: BLOCKER,CRITICAL
          detect_args: --detect.excluded.directories=.bridge --detect.accuracy.required=NONE
          include_diagnostics: false
